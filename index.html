<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EEF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>旅行分账</title>
<style>
  /* ============================================================
     设计方向:「汽水感」
     冷调浅底 + 电光靛蓝做品牌色;荧光青柠只留给"操作和进度"
     (记一笔、Day 标签、已去过的勾),让它成为页面里唯一抢眼的颜色。
     圆体粗字、胶囊选项、浮动底栏;类别和行程类型用 emoji 当图标。
     ============================================================ */
  :root {
    --bg:#EEF0F7; --surface:#FFFFFF; --field:#F2F3FA;
    --ink:#14141F; --sub:#6C6E86; --faint:#B7B9CC; --line:#E1E3EF;
    --brand:#4F46FF; --brand-soft:#E8E7FF; --accent:#4F46FF; --accent-ink:#4F46FF;
    --lime:#C6F432; --lime-soft:#F0FBC8; --pink-soft:#FFE2EB; --sun-soft:#FFF0B3; --sky-soft:#DCF0FF;
    --pos-ink:#3B6B00; --neg-ink:#C2185B; --clay:#C2185B; --sage:#3B6B00;
    --shadow:0 1px 2px rgba(20,20,60,.05), 0 10px 26px -14px rgba(20,20,60,.22);
    --font: ui-rounded,'SF Pro Rounded','PingFang SC','HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
    --serif: var(--font);
    --mono: ui-monospace,'SF Mono',Consolas,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E0E16; --surface:#1A1A27; --field:#242435;
      --ink:#F3F3FA; --sub:#9A9CB6; --faint:#4A4B63; --line:#2C2C40;
      --brand:#7068FF; --brand-soft:#2B2A55; --accent:#8F89FF; --accent-ink:#A9A4FF;
      --lime-soft:#2C3510; --pink-soft:#3D1F2B; --sun-soft:#3A3213; --sky-soft:#17303F;
      --pos-ink:#C6F432; --neg-ink:#FF8FB1; --clay:#FF8FB1; --sage:#C6F432;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
    }
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:var(--font); background:var(--bg); color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  #app { max-width:520px; margin:0 auto; padding:30px 18px 150px; }
  .num { font-variant-numeric:tabular-nums; }

  h1 { font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  h2 { font-size:19px; font-weight:800; letter-spacing:-.01em; margin:30px 0 12px; }
  .eb { font-size:15px; font-weight:800; color:var(--ink); }
  .muted { color:var(--sub); font-size:13.5px; line-height:1.75; }

  button { font:inherit; border:none; border-radius:14px; cursor:pointer; padding:13px 20px; font-weight:700;
    background:none; color:var(--ink); transition:transform .12s ease; }
  button:active { transform:scale(.97); }
  .cta { background:var(--brand); color:#fff; width:100%; padding:15px 20px; border-radius:16px; font-size:16px; font-weight:800; }
  .outline { background:var(--surface); border:1.5px solid var(--line); color:var(--ink); padding:11px 18px; border-radius:14px; }
  .ghost { color:var(--brand); font-weight:700; font-size:14px; padding:6px 0; margin-left:12px; }
  .ghost:first-child { margin-left:0; }
  .icon-btn { color:var(--sub); padding:4px 8px; font-size:13px; font-weight:600; }
  button:focus-visible, summary:focus-visible, a:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }

  .surface { background:var(--surface); border-radius:24px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  :where(input:not([type=checkbox]):not([type=radio]):not([type=file]), select) {
    font:inherit; padding:12px 14px; border:none; width:100%; min-width:0; background:var(--field); color:var(--ink); border-radius:14px; }
  :where(input, select):focus { outline:none; box-shadow:0 0 0 2px var(--brand); }
  label { font-size:12.5px; font-weight:700; color:var(--sub); display:block; margin:16px 0 6px; }
  .row { display:flex; gap:12px; align-items:flex-end; }
  .row > * { flex:1; }

  .checks { display:flex; flex-wrap:wrap; gap:8px; }
  .checks label { display:flex; align-items:center; gap:6px; margin:0; font-size:13.5px; color:var(--ink); background:var(--field);
    border-radius:99px; padding:8px 14px; font-weight:600; cursor:pointer; }
  .checks input { width:auto; accent-color:var(--brand); }
  .checks input[type=radio] { position:absolute; opacity:0; width:0; }
  .checks label:has(input[type=checkbox]:checked) { background:var(--brand-soft); box-shadow:inset 0 0 0 1.5px var(--brand); }
  .checks label:has(input[type=radio]:checked) { background:var(--brand); color:#fff; }
  .checks label:has(input[type=radio]:focus-visible) { outline:3px solid var(--brand); outline-offset:2px; }
  .sv { width:60px; padding:4px 8px; font-size:13px; border-radius:8px; background:var(--surface); }
  .chip { background:var(--field); border-radius:99px; padding:7px 15px; font-size:13.5px; font-weight:700; color:var(--ink); }
  .chip.on { background:var(--brand); color:#fff; }
  .amt-in { font-size:38px; font-weight:800; letter-spacing:-.02em; padding:10px 14px; }
  .cur-in { font-size:18px; font-weight:800; text-align:center; }
  .hint { font-size:12px; color:var(--brand); font-weight:600; margin-top:6px; }

  .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .trip-date { font-size:13px; color:var(--sub); margin-top:6px; font-weight:500; }
  .avatars { display:flex; flex-shrink:0; padding-top:4px; }
  .av { width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    color:#14141F; font-size:12.5px; font-weight:800; border:2.5px solid var(--bg); margin-left:-9px; }
  .avatars .av:first-child { margin-left:0; }
  .av.a0 { background:#C9C6FF; } .av.a1 { background:var(--lime); } .av.a2 { background:#FFB8CF; }
  .av.a3 { background:#FFE27A; } .av.a4 { background:#A9DBFF; }
  .tag { display:inline-flex; align-items:center; background:var(--brand-soft); border-radius:99px; padding:5px 6px 5px 14px;
    margin:0 6px 6px 0; font-size:13.5px; font-weight:700; }

  .status { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--lime-soft);
    border-radius:18px; margin:16px 0 8px; font-size:14px; font-weight:700; cursor:pointer; }
  .status .arr { color:var(--sub); font-size:12.5px; font-weight:600; }

  .bottombar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom));
    width:min(492px, calc(100% - 24px)); background:var(--surface); border-radius:26px; padding:6px; z-index:15;
    box-shadow:0 12px 34px -10px rgba(20,20,70,.35); }
  .bottombar .bb-in { display:flex; gap:4px; }
  .bottombar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px;
    border-radius:20px; font-size:11.5px; font-weight:700; color:var(--sub); }
  .bottombar button .ic { font-size:19px; line-height:1.2; filter:grayscale(1); opacity:.7; }
  .bottombar button.on { background:var(--brand); color:#fff; }
  .bottombar button.on .ic { filter:none; opacity:1; }

  .leader-row { display:flex; align-items:baseline; gap:6px; }
  .leader-row .lbl { white-space:nowrap; }
  .leader-row .ld { flex:1; border-bottom:1.5px dotted var(--line); margin:0 2px 4px; min-width:12px; }
  .leader-row .val { white-space:nowrap; font-weight:700; }

  .tl-head { display:flex; justify-content:space-between; align-items:center; margin:0 0 4px; gap:10px; }
  .tl-head h2 { font-size:22px; }

  .stop-add { font-size:12.5px; color:var(--brand); background:none; border:none; padding:8px 0 0; font-weight:700; }
  .fab { position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    border-radius:99px; padding:14px 26px; font-size:15px; font-weight:800; white-space:nowrap; background:var(--lime);
    color:#14141F; z-index:10; box-shadow:0 14px 30px -10px rgba(20,20,70,.5); }
  .fab:active { transform:translateX(-50%) scale(.97); }

  /* 旅行计划 */
  .plan-day { display:flex; justify-content:space-between; align-items:center; margin:28px 0 2px; }
  .plan-day b { font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .plan-day span { background:var(--lime); color:#14141F; border-radius:99px; padding:4px 12px; font-size:12px; font-weight:800; }
  .plan-item { display:flex; gap:12px; background:var(--surface); border-radius:20px; padding:14px; margin-top:10px; box-shadow:var(--shadow); }
  .plan-item.done { opacity:.62; }
  .plan-item.done .pn { text-decoration:line-through; text-decoration-color:var(--faint); }
  .tick { flex:0 0 24px; width:24px; height:24px; border-radius:50%; border:2px solid var(--faint); padding:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; }
  .tick.on { background:var(--lime); border-color:var(--lime); }
  .tick.on::after { content:'✓'; color:#14141F; font-size:13px; font-weight:900; line-height:1; }
  .pt-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pt { background:var(--brand-soft); color:var(--brand); border-radius:99px; padding:2px 10px; font-size:12.5px; font-weight:800; }
  .pt.none { background:var(--field); color:var(--sub); font-weight:600; }
  .ptag { background:var(--field); border-radius:99px; padding:2px 10px; font-size:12px; font-weight:700; color:var(--sub); }
  .ptag[data-k="景点"]::before { content:'📍 '; } .ptag[data-k="美食"]::before { content:'🍜 '; }
  .ptag[data-k="住宿"]::before { content:'🛏 '; }  .ptag[data-k="交通"]::before { content:'🚆 '; }
  .ptag[data-k="其他"]::before { content:'✨ '; }
  .pn { font-size:18px; font-weight:800; margin-top:6px; letter-spacing:-.01em; }
  .pm { font-size:13px; color:var(--sub); margin-top:4px; line-height:1.6; }
  .plan-item a { font-size:12.5px; font-weight:700; color:var(--brand); text-decoration:none; }
  .ph-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .ph { width:84px; height:84px; border-radius:14px; object-fit:cover; background:var(--field); cursor:pointer; display:block; }
  button.ph.add { border:2px dashed var(--faint); color:var(--sub); font-size:24px; font-weight:400; padding:0; }
  .todo { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
  .todo label { display:flex; align-items:center; gap:10px; margin:0; font-size:14.5px; color:var(--ink); font-weight:600; flex:1; }
  .todo input { width:auto; accent-color:var(--brand); }
  .todo.done label { color:var(--sub); text-decoration:line-through; }

  /* 流水 */
  .exp-row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; gap:10px;
    background:var(--surface); border-radius:18px; margin-top:8px; }
  .exp-ic { flex:0 0 42px; width:42px; height:42px; border-radius:14px; background:var(--brand-soft); display:flex;
    align-items:center; justify-content:center; font-size:20px; }
  .exp-row .who { font-size:12px; color:var(--sub); margin-top:3px; }
  .amt-r { text-align:right; white-space:nowrap; }
  .amt-r .main { font-weight:800; }
  .amt-r .orig { font-size:11.5px; color:var(--sub); }
  .date-h { font-size:13px; font-weight:800; color:var(--sub); margin:24px 4px 4px; }

  /* 换汇 */
  .fx-card { background:var(--brand); color:#fff; box-shadow:0 14px 30px -14px rgba(79,70,255,.7); }
  .fx-card .eb { color:#D6D4FF; }
  .fx-card .s2-title { font-size:24px; color:#fff; }
  .fx-card .ld { border-bottom-color:rgba(255,255,255,.35); }
  .fx-card .muted { color:#D6D4FF; }

  /* 对账 */
  .s2-title { font-size:26px; font-weight:800; margin-top:4px; letter-spacing:-.02em; }
  .s2-sub { font-size:13.5px; color:var(--sub); margin:8px 0 8px; font-weight:500; }
  .balance-row { padding:13px 16px; background:var(--surface); border-radius:16px; margin-top:8px; }
  .balance-row .val { padding:2px 12px; border-radius:99px; background:var(--field); }
  .balance-row .val.pos { background:var(--lime-soft); color:var(--pos-ink); }
  .balance-row .val.neg { background:var(--pink-soft); color:var(--neg-ink); }
  .transfer { padding:18px; background:var(--surface); border-radius:22px; margin-top:12px; box-shadow:var(--shadow); }
  .transfer .route { display:flex; align-items:baseline; gap:9px; font-size:17px; font-weight:800; }
  .transfer .route .arrow { color:var(--faint); font-weight:700; font-size:15px; }
  .transfer .t-amt { margin-left:auto; font-size:22px; font-weight:800; color:var(--brand); letter-spacing:-.02em; }
  .transfer .t-row { display:flex; align-items:baseline; }
  .t-detail { margin-top:10px; }
  .t-detail summary { font-size:12.5px; color:var(--sub); cursor:pointer; list-style:none; font-weight:600; }
  .t-detail summary::-webkit-details-marker { display:none; }
  .detail-line { font-size:12.5px; color:var(--sub); margin-top:8px; line-height:1.9; }
  .t-actions { margin-top:12px; }
  .stamp { display:inline-block; font-size:12px; font-weight:800; color:#14141F; background:var(--lime); border-radius:99px; padding:4px 12px; }

  .stat { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13px; }
  .stat .sl { flex:0 0 78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--sub); font-weight:600; }
  .stat .bar { flex:1; height:10px; background:var(--field); border-radius:99px; overflow:hidden; }
  .stat .bar i { display:block; height:100%; background:var(--brand); min-width:4px; border-radius:99px; }
  .stat .sv2 { flex:0 0 auto; font-size:12.5px; font-weight:700; white-space:nowrap; }

  details.section { margin-bottom:6px; }
  details.section > summary { font-size:14px; font-weight:800; cursor:pointer; list-style:none; padding:14px 16px;
    background:var(--surface); border-radius:16px; display:flex; justify-content:space-between; }
  .surface details.section > summary { background:var(--field); }
  details.section > summary::-webkit-details-marker { display:none; }
  details.section > summary::after { content:'＋'; color:var(--brand); font-weight:700; margin-left:10px; }
  details.section[open] > summary::after { content:'－'; }
  details.section > div { padding:12px 4px 6px; }

  /* 浮层 / 回忆卡 */
  .overlay { position:fixed; inset:0; background:rgba(14,14,30,.82); z-index:20; overflow-y:auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:16px; }
  .overlay canvas { display:none; }
  .recap-card { width:min(320px,92vw); background:var(--brand); border-radius:28px; overflow:hidden; padding:28px 26px 24px; color:#fff;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7); }
  .recap-title { font-size:26px; font-weight:800; letter-spacing:-.02em; color:#fff; }
  .recap-sub { font-size:12.5px; font-weight:600; color:#D6D4FF; margin-top:6px; }
  .recap-rule { height:2px; background:var(--lime); margin:20px 0; border-radius:2px; }
  .recap-stats { display:flex; justify-content:space-between; }
  .stat-box { text-align:center; }
  .stat-num { font-size:28px; font-weight:800; }
  .stat-lb { font-size:12px; color:#D6D4FF; margin-top:3px; font-weight:600; }
  .recap-total { text-align:center; font-size:13px; color:#D6D4FF; margin-top:20px; font-weight:600; }
  .recap-total b { color:var(--lime); font-size:26px; font-weight:800; display:block; margin-top:4px; }
  .recap-facts { margin-top:20px; display:flex; flex-direction:column; gap:12px; }
  .recap-fact { font-size:13px; color:#fff; padding-left:12px; border-left:3px solid var(--lime); line-height:1.6; font-weight:600; }
  .recap-stamp { margin-top:20px; text-align:right; font-size:12px; font-weight:800; color:var(--lime); }
  .lb-img { max-width:94vw; max-height:70vh; border-radius:16px; background:#000; }
  .lb-cap { color:#E8E8F5; font-size:13px; font-weight:700; }

  /* 行程列表 */
  .hero { padding:6px 0 22px; }
  .hero h1 { font-size:36px; }
  .hero p { margin-top:8px; }
  .trip-row { padding:18px; border-radius:24px; margin-bottom:12px; cursor:pointer; }
  .trip-row.c0 { background:var(--brand-soft); } .trip-row.c1 { background:var(--lime-soft); } .trip-row.c2 { background:var(--pink-soft); }
  .trip-row.c3 { background:var(--sun-soft); }  .trip-row.c4 { background:var(--sky-soft); }
  .trip-row .t-name { font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .trip-row .t-total { display:block; font-size:28px; font-weight:800; letter-spacing:-.02em; margin-top:10px; }
  .trip-row .t-meta { font-size:12.5px; color:var(--sub); margin-top:6px; font-weight:600; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  @media print {
    body { background:#fff; color:#000; }
    .bottombar, .fab, button, .icon-btn, .ghost { display:none !important; }
    #app { padding:0; max-width:none; }
    .plan-item, .plan-day { break-inside:avoid; box-shadow:none; border:1px solid #ddd; }
    a { color:inherit; }
  }
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const LS = 'travel-split-v1';
let db = JSON.parse(localStorage.getItem(LS) || '{"trips":[]}');
function migratePayers(db) {
  db.trips.forEach(t => t.expenses.forEach(e => {
    if (!e.payers && e.payerId) { e.payers = { [e.payerId]: e.mainCents }; delete e.payerId; }
  }));
}
function migrateIds(db) {
  db.trips.forEach(t => (t.settlements || []).forEach(s => { if (!s.id) s.id = uid(); }));
}
migratePayers(db);
migrateIds(db);
let view = { screen:'list', tripId:null, tab:'plan', showForm:false, presetStopId:'', showStopForm:false, showRecap:false, showNewTrip:false };
const save = () => { localStorage.setItem(LS, JSON.stringify(db)); pushChanges(trip()); };
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc  = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trip = () => db.trips.find(t => t.id === view.tripId);
const fmt  = c => (c/100).toFixed(2);
const mname = (t,id) => (t.members.find(m => m.id === id) || {name:'?'}).name;
const CATS = ['餐饮','住宿','交通','门票','购物','其他'];
const CURS = ['MYR','JPY','USD','CNY','SGD'];
const KIND_ARR = { member:'members', expense:'expenses', stop:'stops', settlement:'settlements', exchange:'exchanges', todo:'todos' };

function mainPayer(e, memberSet) {
  let best = null;
  for (const [id, c] of Object.entries(e.payers))
    if (id in memberSet && (best === null || c > e.payers[best])) best = id;
  return best;
}
function expenseShares(e, memberSet) {
  const ids = e.participantIds.filter(id => id in memberSet);
  const payer = mainPayer(e, memberSet);
  if (!ids.length || payer === null) return null;
  const sp = e.split || { type: 'equal' };
  const shares = {};
  if (sp.type === 'amount') {
    ids.forEach(id => shares[id] = Math.round((sp.values[id] || 0) * e.rate * 100));
  } else {
    const w = id => (sp.type === 'shares' || sp.type === 'percent') ? (sp.values[id] || 0) : 1;
    const W = ids.reduce((s, id) => s + w(id), 0) || 1;
    ids.forEach(id => shares[id] = Math.floor(e.mainCents * w(id) / W));
  }
  const rem = e.mainCents - Object.values(shares).reduce((s, x) => s + x, 0);
  shares[payer] = (shares[payer] || 0) + rem;
  return shares;
}
function computeBalances(t) {
  const bal = {};
  t.members.forEach(m => bal[m.id] = 0);
  for (const e of t.expenses) {
    const shares = expenseShares(e, bal);
    if (!shares) continue;
    for (const [id, c] of Object.entries(e.payers)) if (id in bal) bal[id] += c;
    for (const [id, c] of Object.entries(shares)) bal[id] -= c;
  }
  for (const s of (t.settlements || [])) { bal[s.from] += s.cents; bal[s.to] -= s.cents; }
  return bal;
}
function settleUp(bal) {
  const arr = Object.entries(bal).map(([id, c]) => ({id, c}));
  const out = [];
  while (true) {
    arr.sort((a, b) => b.c - a.c);
    const cred = arr[0], debt = arr[arr.length - 1];
    if (!cred || cred.c <= 0 || debt.c >= 0) break;
    const amt = Math.min(cred.c, -debt.c);
    out.push({ from: debt.id, to: cred.id, cents: amt });

function fifoRates(t, cur, extra) {
  const batches = (t.exchanges || []).filter(x => x.toCur === cur).sort((a, b) => a.date.localeCompare(b.date))

  if (extra) list.push(extra);
  list.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '~').localeCompare(b.createdAt || '~'));

  for (const e of list) {
    let need = e.amount, cost = 0;
    while (need > 1e-9) {
      const b = batches.find(b => b.left > 1e-9 && b.date <= e.date) || batches.find(b => b.left > 1e-9);

function repriceCash(cur) {
  const t = trip(), map = fifoRates(t, cur);
  const todo = t.expenses.filter(e => e.currency === cur && (e.pay || 'cash') === 'cash' && map[e.id] && Math.abs(+map[e.id].toPrecision(6) / e.rate - 1) > 0.0005);
  if (!todo.length) { alert('没有需要重算的账'); return; }
  let before = 0, after = 0;
  const next = todo.map(e => { const r = repriceExpense(e, +map[e.id].toPrecision(6)); before += e.mainCents; after += r.mainCents; return r; });
  const d = after - before;
  if (!confirm(`将按换汇汇率重算 ${todo.length} 笔 ${cur} 现金支出。\n合计 ${t.currency} ${fmt(before)} → ${fmt(after)}（${d >= 0 ? '多' : '少'} ${fmt(Math.abs(d))}）\n建议先在「备份」页导出一份。继续？`)) return;
  next.forEach(r => { t.expenses[t.expenses.findIndex(x => x.id === r.id)] = r; });
  save(); render();
}
function addExpense(ev) {
  ev.preventDefault();
  const t = trip(), f = ev.target;
  const amount = parseFloat(f.amount.value);
  const cur = f.cur.value.toUpperCase().replace(/[^A-Z0-9]/g, '') || t.currency;
  const rate = cur === t.currency ? 1 : parseFloat(f.rate.value);
  const participantIds = [...f.querySelectorAll('input[name=pt]:checked')].map(x => x.value);
  const payerIds = [...f.querySelectorAll('input[name=py]:checked')].map(x => x.value);
  if (!(amount > 0)) { alert('金额要大于 0'); return; }
  if (!(rate > 0))   { alert('汇率要大于 0'); return; }
  if (!participantIds.length) { alert('至少选一个参与人'); return; }
  if (!payerIds.length) { alert('至少选一个付款人'); return; }
  const mainCents = Math.round(amount * rate * 100);
  let payers;
  if (payerIds.length === 1) payers = { [payerIds[0]]: mainCents };
  else {
    payers = {}; let psum = 0;
    for (const id of payerIds) { const v = parseFloat(f['pv-' + id].value) || 0; payers[id] = Math.round(v * rate * 100); psum += v; }
    if (Math.round(psum * 100) !== Math.round(amount * 100)) { alert(`各付款人金额合计 ${psum} 不等于总额 ${amount}`); return; }
    const top = payerIds.reduce((a, b) => payers[b] > payers[a] ? b : a);
    payers[top] += mainCents - Object.values(payers).reduce((s, x) => s + x, 0);
  }
  const split = { type: f.split.value };
  if (split.type !== 'equal') {
    split.values = {}; let sum = 0;
    for (const id of participantIds) { const v = parseFloat(f['sv-' + id].value) || 0; split.values[id] = v; sum += v; }
    if (split.type === 'shares' && !(sum > 0)) { alert('份数至少要有一个大于 0'); return; }
    if (split.type === 'percent' && Math.round(sum * 100) !== 10000) { alert(`各人比例合计 ${sum}%，要等于 100%`); return; }
    if (split.type === 'amount' && Math.round(sum * 100) !== Math.round(amount * 100)) {
      alert(`各人金额合计 ${sum} 不等于总额 ${amount}`); return; }
  }
  const rec = { id: view.editId || uid(), desc: f.desc.value.trim() || f.cat.value, cat: f.cat.value, date: f.date.value,
    amount, currency: cur, rate, mainCents,
    payers, participantIds, split, stopId: f.stop.value || null, pay: f.pay.value };
  const i = t.expenses.findIndex(x => x.id === rec.id);
  if (i >= 0) { rec.createdAt = t.expenses[i].createdAt; rec.editedAt = new Date().toISOString(); t.expenses[i] = rec; }
  else { rec.createdAt = new Date().toISOString(); t.expenses.push(rec); }
  if (i < 0) t.last = { payerId: payerIds[0], currency: cur, rate, cat: rec.cat, pay: rec.pay };
  save(); view.showForm = false; view.presetStopId = ''; view.editId = ''; view.dupId = ''; render();
}

  m.name = name; save(); render();
}
function detachStop(t, id) {
  t.stops = t.stops.filter(s => s.id !== id);
  t.expenses.forEach(e => { if (e.stopId === id) e.stopId = null; });
}
function delStop(id) {
  const t = trip(), s = (t.stops || []).find(x => x.id === id);
  if (!confirm(`删除这条行程安排？${s && (s.photos || []).length ? '上面的照片会一起删除。' : ''}挂在上面的支出会保留，只是不再挂计划。`)) return;
  detachStop(t, id);
  ((s && s.photos) || []).forEach(pid => { IDB.del(pid).catch(() => {}); delete photoUrls[pid]; });
  save(); render();
}
function copySummary() {
  const t = trip(), bal = computeBalances(t), plan = settleUp(bal);
  const lines = [`【${t.name}】对账（${t.currency}）`, ...t.members.map(m => `${m.name}：${bal[m.id] >= 0 ? '+' : ''}${fmt(bal[m.id])}`)];
  lines.push('', plan.length ? '转账建议：' : '已结清 ✓');
  plan.forEach(p => lines.push(`${mname(t, p.from)} → ${mname(t, p.to)}  ${fmt(p.cents)}`));
  navigator.clipboard.writeText(lines.join('\n')).then(() => alert('已复制，粘贴到群里即可'), () => alert('复制失败，请手动截图'));
}
function markPaid(from, to, cents) {
  const t = trip();
  if (!confirm(`确认 ${mname(t,from)} 已转给 ${mname(t,to)} ${t.currency} ${fmt(cents)}？`)) return;
  t.settlements.push({ id: uid(), from, to, cents, date: new Date().toISOString().slice(0,10) });
  save(); render();
}

function renderPlan(t) {

    <label>备注(可选)</label><input name="snote" placeholder="订位号、交通、要带什么…" value="${es ? esc(es.note || '') : ''}">
    <button class="cta" style="margin-top:16px">${es ? '保存修改' : '加入计划'}</button>

  ${days.map(g => {

    ${g.items.map(s => {

    <button class="cta" style="margin-top:16px">${xe ? '保存修改' : '保存换汇'}</button>
  </form>` : ''}
  <p class="muted" style="margin-top:12px">记下每次换钱的日期和实际汇率。之后用这种外币记账时，汇率自动用你的换汇均价。</p>

    </div>`).join('')}` : ''}`;
}
function matchQ(t, e, q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return true;
  return [e.desc, e.cat, e.currency, ...Object.keys(e.payers).map(id => mname(t, id))].join(' ').toLowerCase().includes(q);
}
function setQ(v) {
  view.q = v; render();
  const el = document.getElementById('q');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
function setLedgerFilter(k, v) { (view.ledgerFilter = view.ledgerFilter || { cat:'', payer:'' })[k] = v; render(); }
function renderLedger(t) {
  const lf = view.ledgerFilter || { cat:'', payer:'' };
  const list = t.expenses.filter(e => (!lf.cat || e.cat === lf.cat) && (!lf.payer || lf.payer in e.payers) && matchQ(t, e, view.q));

    <select onchange="setLedgerFilter('payer', this.value)"><option value="">全部付款人</option>${t.members.map(m =>
      `<option value="${m.id}" ${lf.payer === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
  </div>` : ''}
  <div class="tl-head">
    <span class="muted">${lf.cat || lf.payer || view.q ? '筛选合计' : '总支出'} <b class="num" style="color:var(--ink)">${t.currency} ${fmt(list.reduce((s,e) => s+e.mainCents, 0))}</b></span>
  </div>
  ${Object.entries(groups).map(([date, list]) => `

          <div class="who">${Object.keys(e.payers).map(id => esc(mname(t, id))).join('、')} 付 · ${e.participantIds.length === t.members.length ? '全员' : e.participantIds.map(id => esc(mname(t,id))).join('、')}分摊${e.stopId ? ' · ' + esc(((t.stops || []).find(s => s.id === e.stopId) || {name:'?'}).name) : ''}${e.editedAt ? ` · 编辑于 ${e.editedAt.slice(0,10)}` : ''}</div>
        </div>

          <div class="main num">${t.currency} ${fmt(e.mainCents)}</div>
          ${e.currency !== t.currency ? `<div class="orig">${e.currency} ${e.amount}</div>` : ''}
        </div>

        <button class="icon-btn" onclick="openEditExpense('${e.id}')">改</button>

      </div>`).join('')}
    `).join('') || `<p class="muted">${lf.cat || lf.payer || view.q ? '没有符合筛选的支出。' : '还没有支出。'}</p>`}`;
}

    : { [[last.payerId, sync.me[t.id], t.members[0].id].find(id => t.members.some(m => m.id === id))]: 1 };

  const sp = (e && e.split) || { type:'equal' };
  const svStyle = sp.type === 'equal' ? 'display:none' : '';

  return `<form class="surface" id="expense-form" onsubmit="addExpense(event)" data-main="${esc(t.currency)}">
    <div class="eb">${isEdit ? '编辑支出' : e ? '再记一笔 · 复制自上一笔' : '记一笔'}</div>
    <div class="row" style="align-items:flex-end">
      <div style="flex:3"><input class="amt-in" name="amount" type="number" step="any" min="0" inputmode="decimal" placeholder="0.00" value="${e ? e.amount : ''}" oninput="refreshRate(this.form)" required autofocus></div>
      <div style="flex:1.2"><input class="cur-in" name="cur" value="${esc(cur0)}" maxlength="5" oninput="setCur(this.form, this.value)"></div>

      `<button type="button" class="chip cur-chip ${c === cur0 ? 'on' : ''}" data-c="${esc(c)}" onclick="setCur(this.form,'${esc(c)}')">${esc(c)}</button>`).join('')}</div>
    <div class="rate-row" style="${foreign0 ? '' : 'display:none'};margin-top:4px">

      </div>

    <details class="section" ${isEdit ? 'open' : ''} style="margin-top:18px">
      <summary>更多选项${dflt}</summary>
      <div>
        <label>付款人(可多选合付，${esc(t.currency)} 以外按原币填各自付了多少)</label>
        <div class="checks">${t.members.map(m =>

        <label>参与人(默认全员)</label>
        <div class="checks">${t.members.map(m =>

function statRows(pairs, unit) {
  const max = Math.max(...pairs.map(p => p[1]), 1);
  return pairs.map(([l, c]) => `<div class="stat"><span class="sl">${esc(l)}</span><div class="bar"><i style="width:${(c / max * 100).toFixed(1)}%"></i></div><span class="sv2 num">${unit} ${fmt(c)}</span></div>`).join('');
}

function renderSettle(t) {
  if (!t.members.length) return '<p class="muted">先加成员。</p>';
  const bal = computeBalances(t);
  const plan = settleUp(bal);
  const settled = !plan.length && t.expenses.length;
  const ids = {}; t.members.forEach(m => ids[m.id] = 0);
  const spend = {...ids}, paid = {...ids};
  for (const e of t.expenses) {
    const shares = expenseShares(e, ids);
    if (!shares) continue;
    for (const [id, c] of Object.entries(e.payers)) if (id in paid) paid[id] += c;
    for (const [id, c] of Object.entries(shares)) spend[id] += c;
  }
  const by = key => { const g = {}; t.expenses.forEach(e => g[key(e)] = (g[key(e)] || 0) + e.mainCents); return Object.entries(g); };
  return `
  <div class="s2-title">${settled ? '圆满收官' : '回国前，理清这本账'}</div>
  <div class="s2-sub">${settled ? '<span class="stamp">已结清</span>' : `尚有 ${plan.length} 笔转账，即可结清`}</div>
  ${t.members.map(m => lr(esc(m.name), `${bal[m.id] >= 0 ? '+' : ''}${fmt(bal[m.id])}`,
    `num ${bal[m.id] > 0 ? 'pos' : bal[m.id] < 0 ? 'neg' : ''}`)).map(x => `<div class="balance-row">${x}</div>`).join('')}
  ${plan.length ? `<h2>转账建议 · 最少 ${plan.length} 笔</h2>
  <p class="muted" style="font-size:12.5px;margin-bottom:6px">先算出每人净余额，再用最少的转账笔数互相抵扣——所以每笔转账不一定对应某一张小票，明细仅列直接相关的账。</p>` : ''}
  ${plan.map(p => {
    const d = transferDetail(t, p.from, p.to);
    return `<div class="transfer">
      <div class="t-row route"><span>${esc(mname(t,p.from))}</span><span class="arrow">→</span><span>${esc(mname(t,p.to))}</span><span class="t-amt">${t.currency} ${fmt(p.cents)}</span></div>
      ${d.lines.length ? `<details class="t-detail">
        <summary>查看明细 · ${d.lines.length} 笔</summary>
        <div class="detail-line">${d.lines.map(x => lr(esc(x.desc), fmt(x.cents))).join('')}
        ${d.sum !== p.cents ? `<div style="margin-top:6px">经多人互相抵扣后为 ${t.currency} ${fmt(p.cents)}</div>` : ''}</div>
      </details>` : `<div class="detail-line">由多人债务互相抵扣而来</div>`}
      <div class="t-actions"><button class="outline" onclick="markPaid('${p.from}','${p.to}',${p.cents})">标记已还</button></div>
    </div>`;
  }).join('')}

  <h2>钱花哪儿了</h2>
  <details class="section" open><summary>按类别<span></span></summary><div>${statRows(by(e => e.cat).sort((a, b) => b[1] - a[1]), t.currency)}</div></details>
  <details class="section"><summary>按天<span></span></summary><div>${statRows(by(e => e.date).sort((a, b) => a[0].localeCompare(b[0])), t.currency)}</div></details>
  <details class="section"><summary>按人 · 应摊消费<span></span></summary><div>${statRows(t.members.map(m => [m.name, spend[m.id]]).sort((a, b) => b[1] - a[1]), t.currency)}</div></details>
  <details class="section"><summary>按人 · 垫付<span></span></summary><div>${statRows(t.members.map(m => [m.name, paid[m.id]]).sort((a, b) => b[1] - a[1]), t.currency)}</div></details>
  <button class="outline" style="width:100%;margin-top:26px" onclick="openRecap()">生成回忆卡</button>` : ''}
  ${(t.settlements || []).length ? `<h2>已还记录</h2>${t.settlements.map(s =>
    `<div class="exp-row"><span class="who">${s.date} ${esc(mname(t,s.from))} → ${esc(mname(t,s.to))}</span><span class="num">${t.currency} ${fmt(s.cents)}</span></div>`).join('')}` : ''}`;
}

function recapOverlay() {
  const t = trip(), s = recapStats(t);
  return `<div class="overlay" onclick="if(event.target===this)closeRecap()">
    <div class="recap-card">
      <div class="recap-title">${esc(t.name)}</div>
      <div class="recap-sub">${s.range}</div>
      <div class="recap-rule"></div>
      <div class="recap-stats">
        <div class="stat-box"><div class="stat-num">${s.days}</div><div class="stat-lb">天</div></div>
        <div class="stat-box"><div class="stat-num">${t.expenses.length}</div><div class="stat-lb">笔支出</div></div>
        <div class="stat-box"><div class="stat-num">${(t.stops || []).length}</div><div class="stat-lb">行程</div></div>
      </div>
      <div class="recap-total">总花费<b>${t.currency} ${fmt(s.total)}</b></div>
      <div class="recap-facts">${s.facts.map(f => `<div class="recap-fact">${esc(f)}</div>`).join('')}</div>
      ${s.settled ? '<div class="recap-stamp">已结清</div>' : ''}
    </div>
    <canvas id="recap"></canvas>
    <div class="row" style="flex:0 0 auto">
      <button class="cta" style="width:auto;background:#fff;color:#1B1B16" onclick="saveRecap()">保存分享卡片</button>
      <button class="outline" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="closeRecap()">关闭</button>
    </div>
  </div>`;
}
function recapStats(t) {
  const dates = [...t.expenses.map(e => e.date), ...(t.stops || []).map(s => s.date)].filter(Boolean).sort();
  const days = dates.length ? Math.round((new Date(dates[dates.length-1]) - new Date(dates[0])) / 864e5) + 1 : 0;
  const total = t.expenses.reduce((s,e) => s + e.mainCents, 0);
  const top = obj => Object.entries(obj).sort((a,b) => b[1] - a[1])[0];
  const byDay = {}, byCat = {}, paid = {};
  t.expenses.forEach(e => {
    byDay[e.date] = (byDay[e.date] || 0) + e.mainCents;
    byCat[e.cat]  = (byCat[e.cat]  || 0) + e.mainCents;
    Object.entries(e.payers).forEach(([id, c]) => { const n = mname(t, id); paid[n] = (paid[n] || 0) + c; });
  });
  const fd = d => `${+d.slice(5,7)}.${+d.slice(8,10)}`;
  return {
    range: dates.length ? `${dates[0].slice(0,4)}.${fd(dates[0])} – ${fd(dates[dates.length-1])}` : '',
    days, total,
    facts: t.expenses.length ? [
      `花费最高的一天 · ${+top(byDay)[0].slice(5,7)}/${+top(byDay)[0].slice(8,10)}(${t.currency} ${fmt(top(byDay)[1])})`,
      `花得最多的类别 · ${top(byCat)[0]}`,
      `垫付最多 · ${top(paid)[0]}，记得谢谢 TA`,
    ] : [],
    settled: !settleUp(computeBalances(t)).length && t.expenses.length > 0,
  };
}
function drawRecap() {
  const t = trip(), s = recapStats(t);
  const c = document.getElementById('recap'), x = c.getContext('2d');
  const W = 360, H = 540, S = 2;
  c.width = W*S; c.height = H*S; x.scale(S, S);
  const sans = '-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
  const serif = 'ui-rounded,"PingFang SC",system-ui,sans-serif';
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#5B52FF'); g.addColorStop(1, '#3F36E8');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#fff'; x.font = '800 25px ' + serif; x.fillText(t.name, 30, 64);
  x.fillStyle = '#D6D4FF'; x.font = '600 11px ' + sans; x.textBaseline = 'alphabetic';
  x.fillText(s.range.toUpperCase(), 30, 86);
  x.strokeStyle = '#C6F432'; x.globalAlpha = 1; x.lineWidth = 2; x.lineWidth = 1;
  x.beginPath(); x.moveTo(30, 108); x.lineTo(W-30, 108); x.stroke(); x.globalAlpha = 1;
  const stats = [[String(s.days), '天'], [String(t.expenses.length), '笔支出'], [String((t.stops || []).length), '行程']];
  x.textAlign = 'center';
  stats.forEach(([n, lb], i) => {
    const cx = 30 + (i+.5)*((W-60)/3);
    x.fillStyle = '#fff'; x.font = '800 22px ' + serif; x.fillText(n, cx, 148);
    x.fillStyle = '#D6D4FF'; x.font = '600 9px ' + sans; x.fillText(lb.toUpperCase(), cx, 165);
  });
  x.fillStyle = '#D6D4FF'; x.font = '600 10px ' + sans; x.fillText('总花费', W/2, 200);
  x.fillStyle = '#fff'; x.font = '800 20px ' + serif; x.fillText(`${t.currency} ${fmt(s.total)}`, W/2, 224);
  x.textAlign = 'left';
  s.facts.forEach((f, i) => {
    const y = 262 + i*40;
    x.fillStyle = '#C6F432'; x.fillRect(30, y-11, 1.5, 26);
    x.fillStyle = '#FFFFFF'; x.font = '500 12px ' + sans; x.fillText(f, 40, y+3);
  });
  if (s.settled) {
    x.strokeStyle = 'rgba(255,255,255,.15)'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(30, H-46); x.lineTo(W-30, H-46); x.stroke();
    x.fillStyle = '#C6F432'; x.font = '600 10px ' + sans; x.textAlign = 'right';
    x.fillText('已 结 清', W-30, H-26); x.textAlign = 'left';
  }
  x.fillStyle = '#B9B6FF'; x.font = '500 9px ' + sans; x.textAlign = 'center';
  x.fillText('旅行分账', W/2, H-16); x.textAlign = 'left';
}
function saveRecap() {
  const a = document.createElement('a');
  a.download = `${trip().name}-回忆卡.png`;
  a.href = document.getElementById('recap').toDataURL('image/png');
  a.click();
}
const joinCode0 = typeof location !== 'undefined' && new URLSearchParams(location.search).get('join');
if (joinCode0) joinByCode(joinCode0); else render();
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js');
